services:
  mysql:
    image: mysql:8.0
    container_name: caiwu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: caiwu123
      MYSQL_DATABASE: caiwu
    ports:
      # 宿主 3307，避免与你本机已有的 MySQL(3306) 冲突
      - "3307:3306"
    volumes:
      - caiwu-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p caiwu123"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caiwu-mysql-data:
